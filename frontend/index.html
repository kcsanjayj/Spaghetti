<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" id="themeColor">
  <script src="js/boot.js"></script>
  <title>Spaghetti</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22black%22/><path d=%22M15 55c12-30 20 20 35-6s25 14 35-8%22 stroke=%22white%22 stroke-width=%228%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="dlbar"><i></i></div>
  <div class="app">
    <header class="top">
      <button class="btn icon" id="historyBtn" aria-label="Chat history" data-icon="history"></button>
      <h1 class="logo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 14c3-8 5 5 8-2s5 6 8-1 3 2 4-2"/></svg><span>spaghetti</span></h1>
      <div class="grow"></div>
      <div class="pickwrap">
        <button class="pick" id="modelBtn" aria-haspopup="dialog" aria-expanded="false"><i class="dot" id="modelDot"></i><span id="modelName">Choose a model</span><span data-icon="chevron"></span></button>
        <div class="sheet-scrim" id="sheetScrim"></div>
        <div class="sheet" id="sheet" role="dialog" aria-label="Choose a model" aria-hidden="true"></div>
      </div>
      <button class="btn icon" id="newBtn" aria-label="New chat" data-icon="plus"></button>
      <button class="btn icon" id="themeBtn" aria-label="Switch theme"></button>
    </header>

    <main id="chat">
      <div id="messages" class="messages" role="log" aria-live="polite" tabindex="-1"><div class="col" id="thread"></div></div>
      <button class="btn jump" id="jumpBtn" aria-label="Jump to latest" data-icon="chevron"></button>
      <div class="composer">
        <div class="docs" id="docChips" aria-label="Your documents"></div>
        <form id="askForm">
          <button type="button" class="btn icon" id="attachBtn" aria-label="Add documents" title="Add documents" data-icon="paperclip"></button>
          <input type="file" id="fileInput" hidden multiple accept=".txt,.md,.csv,.json,.log,.py,.js,.html,.css,.rs,.toml,.yaml,.yml,.pdf,.docx">
          <textarea id="question" rows="1" placeholder="Ask about your documents" required></textarea>
          <button class="btn primary icon" id="sendBtn" aria-label="Send" data-icon="arrow"></button>
        </form>
        <p class="foot">Runs on your device with Ollama. Small models can make mistakes, so check important facts.</p>
      </div>
      <div class="dropzone" id="dropzone"><b>Drop files to add them to your pantry</b></div>
    </main>

    <div class="drawer" id="drawer"><div class="scrim" id="scrim"></div>
      <aside aria-label="Chat history"><button class="btn primary" id="newChat" data-icon="plus">&nbsp;New chat</button><ul id="chatList"></ul></aside></div>
  </div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
